<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資料アプリを開く</title>
<script>window.__API_URL='https://script.google.com/macros/s/AKfycbxcRaVoS6NF2sedBw_pS28o-8349pj51kbF6yTnZYTOq4DF8RmcOgtwi2uKvJ0358mhpw/exec';</script>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #F5F2EA; color: #222; }
  .w { max-width: 460px; margin: 18vh auto 0; padding: 0 22px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  p { font-size: 16px; line-height: 1.7; margin: 0 0 14px; white-space: pre-wrap; }
  .sp { width: 34px; height: 34px; margin: 18px auto; border: 4px solid #cfe8d8; border-top-color: #06C755; border-radius: 50%; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  button { font-size: 16px; font-weight: 700; padding: 12px 22px; border-radius: 999px; border: 0; background: #06C755; color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<!-- ★★ 公式LINE のリッチメニュー［📷 資料アプリを開く］の入口（LIFF。2026-10-27）
     LINE の本人確認（IDトークン）を サーバ（lineOpen）が LINE に確かめ、その人の顧問先のアプリへ そのまま移る。
     この頁には 顧問先のことは何も書かない（URL は サーバが その人にだけ返す） -->
<div class="w">
  <h1 id="t">資料アプリを開いています…</h1>
  <div class="sp" id="sp"></div>
  <p id="m"></p>
  <button type="button" id="again" hidden>もう一度ためす</button>
</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script>
(function () {
  var LIFF_ID = '2012229599-XN9zmUpb';
  var API = window.__API_URL || '';
  function $(i) { return document.getElementById(i); }
  function say(title, msg, retry) { $('t').textContent = title; $('m').textContent = msg || ''; $('sp').hidden = true; $('again').hidden = !retry; }
  $('again').addEventListener('click', function () { location.reload(); });
  function open() {
    var tok = liff.getIDToken();
    if (!tok) { liff.login({ redirectUri: location.href }); return; }
    fetch(API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'lineOpen', args: [tok] }) })
      .then(function (r) { return r.json(); })
      .then(function (o) {
        if (!o || !o.ok) {
          /* IDトークンが古い（しばらく開いていなかった）。1回だけ ログインし直して とり直す */
          if (!sessionStorage.getItem('lfx')) { sessionStorage.setItem('lfx', '1'); try { liff.logout(); } catch (e) {} liff.login({ redirectUri: location.href }); return; }
          say('開けませんでした', (o && o.msg) || 'もう一度 メニューから開いてください。', true); return;
        }
        sessionStorage.removeItem('lfx');
        if (o.r && o.r.url && /^https:\/\/(ishii-office\.github\.io|script\.google\.com)\/[^\s?#]*\?(?:[^\s#]*&)?t=[0-9a-f]{32}$/.test(o.r.url)) { location.replace(o.r.url); return; }
        say('まだ つながっていません', (o.r && o.r.msg) || '', false);
      }, function () { say('つながりませんでした', '電波の良いところで もう一度ためしてください。', true); });
  }
  if (!API || !window.liff) { say('開けませんでした', 'LINE の中から開いてください。', true); return; }
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    open();
  }, function () { say('開けませんでした', 'LINE の中から 公式LINE のメニューで開いてください。', true); });
})();
</script>
</body>
</html>
